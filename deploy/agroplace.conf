server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location = /api/erd-events {
        proxy_pass         http://172.31.46.50:3001/api/erd-events;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass         http://172.31.46.50:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /slide {
        alias /usr/share/nginx/html/slide.html;
        default_type text/html;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }

    location = /pitch {
        alias /usr/share/nginx/html/pitch.html;
        default_type text/html;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }

    location = /builder {
        alias /usr/share/nginx/html/builder.html;
        default_type text/html;
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control 'public, immutable';
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
    }
}
